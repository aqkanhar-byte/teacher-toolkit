name: Keep Render instance awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production so the free Render instance never sleeps
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://www.teachertoolkitsindh.com/version")
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 500 ]; then
            echo "::warning::Ping got a $STATUS response — the app may be down, not just asleep."
          fi
